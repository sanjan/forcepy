[project]
name = "forcepy"
version = "0.1.1"
description = "A faster way to work with Salesforce - Modern Python client with advanced features"
readme = "README.md"
authors = [
    { name = "Sanjan Grero", email = "sgrero@salesforce.com" }
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
    "python-dateutil>=2.8.0",
    "cachetools>=5.3.0",
]
license = { text = "MIT" }
keywords = [
    "salesforce",
    "sfdc",
    "api",
    "crm",
    "soql",
    "force",
    "integration",
    "client",
    "rest-api",
    "composite-api",
    "chatter",
    "jwt",
    "oauth",
    "query-builder"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

[project.optional-dependencies]
jwt = ["PyJWT>=2.0.0", "cryptography>=3.0.0"]
redis = ["redis>=4.0.0"]
all = ["PyJWT>=2.0.0", "cryptography>=3.0.0", "redis>=4.0.0"]

[project.urls]
Homepage = "https://github.com/sanjan/forcepy"
Repository = "https://github.com/sanjan/forcepy"
Documentation = "https://github.com/sanjan/forcepy/tree/main/docs"
"Bug Tracker" = "https://github.com/sanjan/forcepy/issues"
"Changelog" = "https://github.com/sanjan/forcepy/blob/main/CHANGELOG.md"
Discussions = "https://github.com/sanjan/forcepy/discussions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forcepy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=forcepy --cov-report=html --cov-report=term"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "N802",    # Function name should be lowercase (SOQL helpers: IN, DATE, BOOL are intentional)
    "N818",    # Exception name should end with Error (BulkJobTimeout is intentional)
]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
disable_warnings = ["module-not-measured"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Task runner scripts (works with uv, hatch, etc.)
[tool.hatch.envs.default.scripts]
test = "pytest {args}"
test-cov = "pytest --cov=forcepy --cov-report=html --cov-report=term {args}"
lint = "ruff check src/ tests/ {args}"
lint-fix = "ruff check --fix src/ tests/ {args}"
format = "ruff format src/ tests/ {args}"
format-check = "ruff format --check src/ tests/ {args}"
typecheck = "mypy src/forcepy/ {args}"
quality = ["format", "lint-fix", "typecheck", "test"]
build = "python -m build"
clean = "rm -rf dist/ build/ *.egg-info .pytest_cache .ruff_cache .mypy_cache htmlcov .coverage"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.3.0",
    "twine>=6.2.0",
]
